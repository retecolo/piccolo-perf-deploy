---
- name: Ensure nftables is installed
  ansible.builtin.package:
    name: nftables
    state: present
  when: firewall_mode not in ['none', 'mtls']

- name: Ensure nftables.d include directory exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: firewall_mode not in ['none', 'mtls']

- name: Ensure the include directive is present in nftables.conf
  ansible.builtin.shell: |
    grep -q 'nftables.d' /etc/nftables.conf || \
      echo 'include "/etc/nftables.d/*.nft"' >> /etc/nftables.conf
  args:
    executable: /bin/bash
  changed_when: false
  when: firewall_mode not in ['none', 'mtls']

- name: Deploy the prometheus mesh-only firewall rule
  ansible.builtin.template:
    src: prometheus.nft.j2
    dest: /etc/nftables.d/prometheus.nft
    owner: root
    group: root
    mode: "0644"
  register: prometheus_nft
  when: firewall_mode not in ['none', 'mtls']

- name: Enable nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
  when: firewall_mode not in ['none', 'mtls']

- name: Apply the updated ruleset
  ansible.builtin.command: nft -f /etc/nftables.conf
  when: firewall_mode not in ['none', 'mtls'] and prometheus_nft.changed
  changed_when: true
