---
config_server_port: 8443
config_server_www_dir: /etc/piccolo-fleet/www
config_server_tls_dir: /etc/piccolo-fleet/tls
# Set to true only on hosts where the nginx default site is not used by other
# services (e.g. Grafana). False preserves any existing default vhost.
config_server_remove_default_site: false
