---
- name: Warn if deprecated mesh_ipv6 variable is in use
  ansible.builtin.debug:
    msg: "WARNING: mesh_ipv6 is deprecated — rename to probe_address in inventory/hosts.ini"
  when: hostvars[inventory_hostname]['mesh_ipv6'] is defined and
        hostvars[inventory_hostname]['probe_address'] is not defined

- name: Set probe_address from inventory (preferred path)
  ansible.builtin.set_fact:
    probe_address: "{{ hostvars[inventory_hostname]['probe_address'] }}"
  when: hostvars[inventory_hostname]['probe_address'] is defined

- name: Set probe_address from deprecated mesh_ipv6 (backward compat)
  ansible.builtin.set_fact:
    probe_address: "{{ hostvars[inventory_hostname]['mesh_ipv6'] }}"
  when: hostvars[inventory_hostname]['probe_address'] is not defined and
        hostvars[inventory_hostname]['mesh_ipv6'] is defined

- name: Derive probe_address from mesh interface (VPN fallback)
  ansible.builtin.set_fact:
    probe_address: "{{ (ansible_facts[mesh_iface]['ipv6'] | selectattr('scope', 'ne', 'link') | first).address }}"
  when: hostvars[inventory_hostname]['probe_address'] is not defined and
        hostvars[inventory_hostname]['mesh_ipv6'] is not defined and
        mesh_iface is defined

- name: Fail fast if probe_address could not be determined
  ansible.builtin.assert:
    that:
      - probe_address is defined
      - probe_address | length > 0
    fail_msg: >
      probe_address is not set for host '{{ inventory_hostname }}'.
      Add probe_address=<ipv6-or-ipv4> to this host's line in inventory/hosts.ini,
      or set mesh_iface in group_vars/all.yml to enable interface-based discovery.

- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Ensure the config server directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ config_server_www_dir | dirname }}", mode: "0755" }
    - { path: "{{ config_server_www_dir }}", mode: "0755" }
    - { path: "{{ config_server_tls_dir }}", mode: "0750" }

- name: Deploy the fleet topology config
  ansible.builtin.template:
    src: piccolo-config.json.j2
    dest: "{{ config_server_www_dir }}/piccolo-perf-config.json"
    owner: root
    group: root
    mode: "0644"

- name: Ensure the nginx systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the mesh-VPN ordering drop-in for nginx
  ansible.builtin.template:
    src: piccolo-fleet-mesh.conf.j2
    dest: /etc/systemd/system/nginx.service.d/piccolo-fleet.conf
    owner: root
    group: root
    mode: "0644"
  register: config_server_dropin

- name: Reload systemd if the drop-in changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: config_server_dropin.changed

- name: Check whether the TLS cert is present
  ansible.builtin.stat:
    path: "{{ config_server_tls_dir }}/fullchain.pem"
  register: config_server_cert_stat

- name: Deploy the config-server HTTPS vhost
  ansible.builtin.template:
    src: config-server.conf.j2
    dest: /etc/nginx/conf.d/piccolo-fleet-config-server.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx
  when: config_server_cert_stat.stat.exists

- name: Remove the nginx default site to avoid vhost conflicts
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx
  when: config_server_remove_default_site | bool and config_server_cert_stat.stat.exists

- name: Enable and start nginx (cert present)
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  when: config_server_cert_stat.stat.exists

- name: Enable nginx without starting (cert not yet distributed)
  ansible.builtin.systemd:
    name: nginx
    enabled: true
  when: not config_server_cert_stat.stat.exists

- name: Restrict the config server port to the mesh interface
  ansible.builtin.import_tasks: firewall.yml
