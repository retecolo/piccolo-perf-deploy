---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Re-derive mesh_ipv6 for this verification play
      ansible.builtin.set_fact:
        mesh_ipv6: "{{ (ansible_facts[mesh_iface]['ipv6'] | selectattr('scope', 'ne', 'link') | first).address }}"

    - name: Assert the mesh IPv6 address was resolved
      ansible.builtin.assert:
        that:
          - mesh_ipv6 == "fd00:dead:beef::30"

    - name: Assert the topology JSON was templated with the fixture host
      ansible.builtin.command: cat /etc/piccolo-fleet/www/piccolo-config.json
      register: config_json
      changed_when: false

    - name: Assert the fixture host name is present
      ansible.builtin.assert:
        that:
          - "'probe-a' in config_json.stdout"

    - name: Assert nginx is active
      ansible.builtin.command: systemctl is-active nginx
      register: config_server_nginx_active
      changed_when: false
      failed_when: config_server_nginx_active.stdout != "active"

    - name: Assert the config JSON is reachable over HTTPS via the mesh interface
      ansible.builtin.uri:
        url: "https://config-server-test.mesh.example.net:8443/piccolo-config.json"
        status_code: 200
        return_content: true
      register: config_fetch

    - name: Assert the served content matches the templated fixture
      ansible.builtin.assert:
        that:
          - "'probe-a' in config_fetch.content"

    - name: Read the deployed nftables ruleset
      ansible.builtin.command: nft list ruleset
      register: config_server_nft_ruleset
      changed_when: false

    - name: Assert the mesh-only restriction is present
      ansible.builtin.assert:
        that:
          - "'piccolo_fleet_config' in config_server_nft_ruleset.stdout"
