---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: config-server-test
    image: geerlingguy/docker-debian12-ansible:latest
    command: /lib/systemd/systemd
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible/tmp
  connection_options:
    ansible_connection: docker
  inventory:
    host_vars:
      config-server-test:
        mesh_iface: dummy0
        mesh_vpn_service: network.target
        mesh_domain: mesh.example.net
        piccolo_perf_hosts:
          - { name: probe-a, address: "fd00:dead:beef::1", site: site-a }
        piccolo_perf_measurements:
          - { type: dns, interval: 120s, resolvers: ["2620:fe::fe"], names: ["example.com"] }
        ansible_connection: docker
verifier:
  name: ansible
