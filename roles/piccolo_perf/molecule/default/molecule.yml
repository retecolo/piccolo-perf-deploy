---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: piccolo-perf-test
    image: geerlingguy/docker-debian12-ansible:latest
    command: /lib/systemd/systemd
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible/tmp
  connection_options:
    ansible_connection: docker
  inventory:
    host_vars:
      piccolo-perf-test:
        mesh_iface: dummy0
        mesh_vpn_service: network.target
        mesh_domain: mesh.example.net
        config_server_port: 8443
        piccolo_perf_config_url: "https://piccolo-perf-test.mesh.example.net:8443/piccolo-config.json"
        ansible_connection: docker
verifier:
  name: ansible
