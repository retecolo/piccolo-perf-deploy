---
- name: Fail fast if source_prefix mode requires allowed_source_prefixes
  ansible.builtin.assert:
    that:
      - allowed_source_prefixes | length > 0
    fail_msg: >
      firewall_mode is 'source_prefix' but allowed_source_prefixes is empty.
      Add at least one IPv6 prefix or address to allowed_source_prefixes in
      inventory/group_vars/all.yml, e.g.:
        allowed_source_prefixes:
          - 2001:db8::/32
  when: firewall_mode == 'source_prefix'

- name: Ensure nftables is installed
  ansible.builtin.package:
    name: nftables
    state: present
  when: firewall_mode not in ['none', 'mtls']

- name: Ensure nftables.d include directory exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: firewall_mode not in ['none', 'mtls']

- name: Ensure the include directive is present in nftables.conf
  ansible.builtin.shell: |
    grep -q 'nftables.d' /etc/nftables.conf || \
      echo 'include "/etc/nftables.d/*.nft"' >> /etc/nftables.conf
  args:
    executable: /bin/bash
  changed_when: false
  when: firewall_mode not in ['none', 'mtls']

- name: Deploy the piccolo-perf mesh-only firewall rule
  ansible.builtin.template:
    src: piccolo-perf.nft.j2
    dest: /etc/nftables.d/piccolo-perf.nft
    owner: root
    group: root
    mode: "0644"
  register: piccolo_perf_nft
  when: firewall_mode not in ['none', 'mtls']

- name: Enable nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
  when: firewall_mode not in ['none', 'mtls']

- name: Apply the updated piccolo-perf ruleset
  ansible.builtin.command: nft -f /etc/nftables.d/piccolo-perf.nft
  when: firewall_mode not in ['none', 'mtls'] and piccolo_perf_nft.changed
  changed_when: true
