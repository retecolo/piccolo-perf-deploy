---
- name: Smoke-test piccolo-perf exporters
  hosts: piccolo_perf
  become: false
  gather_facts: true
  vars:
    piccolo_perf_metrics_port: 9862
  tasks:
    - name: Set probe_address for verify (with mesh_ipv6 fallback)
      ansible.builtin.set_fact:
        _verify_addr: "{{ hostvars[inventory_hostname]['probe_address'] | default(hostvars[inventory_hostname]['mesh_ipv6'] | default('')) }}"

    - name: Skip hosts without a probe address
      ansible.builtin.meta: end_host
      when: _verify_addr == ''

    - name: Curl /metrics over HTTPS
      ansible.builtin.uri:
        url: "https://{{ '[' + _verify_addr + ']' if ':' in _verify_addr else _verify_addr }}:{{ piccolo_perf_metrics_port }}/metrics"
        validate_certs: false
        return_content: false
        status_code: 200
      delegate_to: localhost

- name: Smoke-test the config server
  hosts: config_server_hosts
  become: false
  gather_facts: false
  vars:
    config_server_port: 8443
  tasks:
    - name: Curl the topology JSON over HTTPS
      ansible.builtin.uri:
        url: "{{ piccolo_perf_config_url }}"
        validate_certs: false
        return_content: false
        status_code: 200
      delegate_to: localhost

- name: Smoke-test Prometheus
  hosts: prometheus_hosts
  become: false
  gather_facts: true
  vars:
    prometheus_web_port: 9090
  tasks:
    - name: Set probe_address for verify (with mesh_ipv6 fallback)
      ansible.builtin.set_fact:
        _verify_addr: "{{ hostvars[inventory_hostname]['probe_address'] | default(hostvars[inventory_hostname]['mesh_ipv6'] | default('')) }}"

    - name: Skip hosts without a probe address
      ansible.builtin.meta: end_host
      when: _verify_addr == ''

    - name: Curl /-/healthy over HTTPS with basic auth
      ansible.builtin.uri:
        url: "https://{{ '[' + _verify_addr + ']' if ':' in _verify_addr else _verify_addr }}:{{ prometheus_web_port }}/-/healthy"
        user: "{{ prometheus_basic_auth_username | default('admin') }}"
        password: "{{ prometheus_basic_auth_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      delegate_to: localhost

    - name: Query Prometheus API for piccolo_perf targets
      vars:
        _prom_host: "{{ '[' + _verify_addr + ']' if ':' in _verify_addr else _verify_addr }}"
      ansible.builtin.uri:
        url: "https://{{ _prom_host }}:{{ prometheus_web_port }}/api/v1/query?query=up%7Bjob%3D%22piccolo_perf%22%7D"
        user: "{{ prometheus_basic_auth_username | default('admin') }}"
        password: "{{ prometheus_basic_auth_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        return_content: true
      register: prometheus_up_query
      delegate_to: localhost

    - name: Assert at least one piccolo_perf target reports up == 1
      ansible.builtin.assert:
        that:
          - prometheus_up_query.json.data.result | length > 0
          - prometheus_up_query.json.data.result | selectattr('value', 'contains', '1') | list | length > 0
        fail_msg: "No piccolo_perf targets are reporting up == 1"
