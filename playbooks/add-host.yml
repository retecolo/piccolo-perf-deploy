---
# Add one or more hosts to the piccolo-perf fleet.
#
# Prerequisites:
#   - Host line added to [piccolo_perf] in inventory/hosts.ini with mesh_ipv6= and site=
#   - Add to [prometheus_hosts] too if this host should run Prometheus
#   - SSH access from the control node to the new host
#
# Usage:
#   ansible-playbook -u configbot --private-key=~/.ssh/id_rsa_configbot \
#     -i inventory/hosts.ini playbooks/add-host.yml \
#     -e new_host=rdns4 --ask-vault-pass
#
# The -e new_host= variable targets the new host plays without restricting
# the cert fetch (which must run on cert_issuer_hosts/localhost regardless).

- name: Fetch the wildcard cert from the cert issuer to the controller
  hosts: cert_issuer_hosts
  become: true
  vars:
    live_dir: "/etc/letsencrypt/live/{{ mesh_domain }}"
  tasks:
    - name: Fail if new_host is not specified
      ansible.builtin.fail:
        msg: "Specify the new host with -e new_host=<hostname>"
      when: new_host is not defined
      run_once: true

    - name: Fetch fullchain from cert issuer
      ansible.builtin.fetch:
        src: "{{ live_dir }}/fullchain.pem"
        dest: "/tmp/piccolo-fleet-cert/fullchain.pem"
        flat: true

    - name: Fetch privkey from cert issuer
      ansible.builtin.fetch:
        src: "{{ live_dir }}/privkey.pem"
        dest: "/tmp/piccolo-fleet-cert/privkey.pem"
        flat: true
      no_log: true

- name: Install piccolo-perf on the new host
  hosts: "{{ new_host }}"
  become: true
  roles:
    - piccolo_perf

- name: Push the wildcard cert to the new piccolo-perf host
  hosts: "{{ new_host }}"
  become: true
  vars:
    cert_src_dir: "/tmp/piccolo-fleet-cert"
    piccolo_perf_tls_dir: /etc/piccolo-perf/tls
    piccolo_perf_cert_group: piccolo-perf-cert
    piccolo_perf_service_name: piccolo-perf-exporter
  tasks:
    - name: Copy fullchain to new host
      ansible.builtin.copy:
        src: "{{ cert_src_dir }}/fullchain.pem"
        dest: "{{ piccolo_perf_tls_dir }}/fullchain.pem"
        owner: root
        group: "{{ piccolo_perf_cert_group }}"
        mode: "0640"
      notify: restart piccolo-perf

    - name: Copy privkey to new host
      ansible.builtin.copy:
        src: "{{ cert_src_dir }}/privkey.pem"
        dest: "{{ piccolo_perf_tls_dir }}/privkey.pem"
        owner: root
        group: "{{ piccolo_perf_cert_group }}"
        mode: "0640"
      notify: restart piccolo-perf
      no_log: true

  handlers:
    - name: restart piccolo-perf
      ansible.builtin.systemd:
        name: "{{ piccolo_perf_service_name }}"
        state: restarted

- name: Install Prometheus on the new host (if in prometheus_hosts)
  hosts: "{{ new_host }}"
  become: true
  tasks:
    - name: Skip hosts not in prometheus_hosts group
      ansible.builtin.meta: end_host
      when: "'prometheus_hosts' not in group_names"
  roles:
    - prometheus_hardened

- name: Push the wildcard cert to the new Prometheus host
  hosts: "{{ new_host }}"
  become: true
  vars:
    cert_src_dir: "/tmp/piccolo-fleet-cert"
    tls_cert_dir_prometheus: /etc/prometheus/tls
  tasks:
    - name: Skip hosts not in prometheus_hosts group
      ansible.builtin.meta: end_host
      when: "'prometheus_hosts' not in group_names"

    - name: Copy fullchain to prometheus host
      ansible.builtin.copy:
        src: "{{ cert_src_dir }}/fullchain.pem"
        dest: "{{ tls_cert_dir_prometheus }}/fullchain.pem"
        owner: prometheus
        group: prometheus
        mode: "0640"
      notify: restart prometheus

    - name: Copy privkey to prometheus host
      ansible.builtin.copy:
        src: "{{ cert_src_dir }}/privkey.pem"
        dest: "{{ tls_cert_dir_prometheus }}/privkey.pem"
        owner: prometheus
        group: prometheus
        mode: "0640"
      notify: restart prometheus
      no_log: true

  handlers:
    - name: restart prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: restarted

- name: Regenerate fleet config JSON to include the new host
  hosts: config_server_hosts
  become: true
  roles:
    - config_server

- name: Regenerate Prometheus scrape config on all existing Prometheus hosts
  hosts: prometheus_hosts
  become: true
  roles:
    - prometheus_hardened
