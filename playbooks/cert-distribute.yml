---
- name: Fetch the wildcard certificate from the cert issuer to the controller
  hosts: cert_issuer_hosts
  become: true
  vars:
    live_dir: "/etc/letsencrypt/live/{{ mesh_domain }}"
  tasks:
    - name: Verify the source privkey is a PEM TLS key (not an SSH key)
      ansible.builtin.command: openssl pkey -in {{ live_dir }}/privkey.pem -noout
      changed_when: false
      register: privkey_check
      failed_when: privkey_check.rc != 0

    - name: Clean staging directory to prevent stale files being distributed
      ansible.builtin.file:
        path: /tmp/piccolo-fleet-cert
        state: absent
      delegate_to: localhost
      become: false
      run_once: true

    - name: Create fresh staging directory
      ansible.builtin.file:
        path: /tmp/piccolo-fleet-cert
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Fetch fullchain from cert issuer
      ansible.builtin.fetch:
        src: "{{ live_dir }}/fullchain.pem"
        dest: "/tmp/piccolo-fleet-cert/fullchain.pem"
        flat: true

    - name: Fetch privkey from cert issuer
      ansible.builtin.fetch:
        src: "{{ live_dir }}/privkey.pem"
        dest: "/tmp/piccolo-fleet-cert/privkey.pem"
        flat: true
      no_log: true

    - name: Verify the fetched privkey is a valid PEM TLS key
      ansible.builtin.command: openssl pkey -in /tmp/piccolo-fleet-cert/privkey.pem -noout
      changed_when: false
      delegate_to: localhost
      become: false
      run_once: true

- name: Distribute the wildcard certificate to the fleet
  hosts: piccolo_perf:prometheus_hosts:config_server_hosts
  become: true
  vars:
    cert_src_dir: "/tmp/piccolo-fleet-cert"
    piccolo_perf_tls_dir: /etc/piccolo-perf/tls
    piccolo_perf_cert_group: piccolo-perf-cert
    piccolo_perf_service_name: piccolo-perf-exporter
    tls_cert_dir_prometheus: /etc/prometheus/tls
    config_server_tls_dir: /etc/piccolo-fleet/tls
  tasks:
    - name: Ensure piccolo-perf TLS directory exists
      ansible.builtin.file:
        path: "{{ piccolo_perf_tls_dir }}"
        state: directory
        owner: root
        group: "{{ piccolo_perf_cert_group }}"
        mode: "0750"
      when: "'piccolo_perf' in group_names"

    - name: Ensure prometheus TLS directory exists
      ansible.builtin.file:
        path: "{{ tls_cert_dir_prometheus }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: "0750"
      when: "'prometheus_hosts' in group_names"

    - name: Ensure config server TLS directory exists
      ansible.builtin.file:
        path: "{{ config_server_tls_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      when: "'config_server_hosts' in group_names"

    - name: Copy fullchain to piccolo-perf hosts
      ansible.builtin.copy:
        src: "{{ cert_src_dir }}/fullchain.pem"
        dest: "{{ piccolo_perf_tls_dir }}/fullchain.pem"
        owner: root
        group: "{{ piccolo_perf_cert_group }}"
        mode: "0640"
      when: "'piccolo_perf' in group_names"
      notify: restart piccolo-perf

    - name: Copy privkey to piccolo-perf hosts
      ansible.builtin.copy:
        src: "{{ cert_src_dir }}/privkey.pem"
        dest: "{{ piccolo_perf_tls_dir }}/privkey.pem"
        owner: root
        group: "{{ piccolo_perf_cert_group }}"
        mode: "0640"
      when: "'piccolo_perf' in group_names"
      notify: restart piccolo-perf
      no_log: true

    - name: Copy fullchain to prometheus hosts
      ansible.builtin.copy:
        src: "{{ cert_src_dir }}/fullchain.pem"
        dest: "{{ tls_cert_dir_prometheus }}/fullchain.pem"
        owner: prometheus
        group: prometheus
        mode: "0640"
      when: "'prometheus_hosts' in group_names"
      notify: restart prometheus

    - name: Copy privkey to prometheus hosts
      ansible.builtin.copy:
        src: "{{ cert_src_dir }}/privkey.pem"
        dest: "{{ tls_cert_dir_prometheus }}/privkey.pem"
        owner: prometheus
        group: prometheus
        mode: "0640"
      when: "'prometheus_hosts' in group_names"
      notify: restart prometheus
      no_log: true

    - name: Copy fullchain to the config server host
      ansible.builtin.copy:
        src: "{{ cert_src_dir }}/fullchain.pem"
        dest: "{{ config_server_tls_dir }}/fullchain.pem"
        owner: root
        group: root
        mode: "0644"
      when: "'config_server_hosts' in group_names"
      notify: reload nginx on config server

    - name: Copy privkey to the config server host
      ansible.builtin.copy:
        src: "{{ cert_src_dir }}/privkey.pem"
        dest: "{{ config_server_tls_dir }}/privkey.pem"
        owner: root
        group: root
        mode: "0640"
      when: "'config_server_hosts' in group_names"
      notify: reload nginx on config server
      no_log: true

  handlers:
    - name: restart piccolo-perf
      ansible.builtin.systemd:
        name: "{{ piccolo_perf_service_name }}"
        state: restarted

    - name: restart prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: restarted

    - name: reload nginx on config server
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
