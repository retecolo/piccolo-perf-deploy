# Copy this file to inventory/hosts.ini and edit to match your fleet.
#
# Each host in [piccolo_perf] requires two host variables:
#   mesh_ipv6  — the host's mesh VPN IPv6 address (tailscale0, wt0, etc.)
#                This is the address Prometheus scrapes and piccolo-perf uses
#                for TWAMP reflector discovery.
#   site       — a short string label for the host's physical/logical site.
#                Always quote numeric-looking values (e.g. site="809").
#
# To ADD a host: add one line to [piccolo_perf] with mesh_ipv6 and site.
#                Run: ansible-playbook -i inventory/hosts.ini playbooks/add-host.yml --limit <hostname> --ask-vault-pass
#
# To REMOVE a host: run decommission first, then delete the line.
#                Run: ansible-playbook -i inventory/hosts.ini playbooks/decommission.yml --limit <hostname> --ask-vault-pass
#                Then delete the host line from this file and re-run site.yml.

[piccolo_perf]
probe-a  ansible_host=probe-a.mesh.example.net  mesh_ipv6=fd00:dead:beef::1  site="site-a"
probe-b  ansible_host=probe-b.mesh.example.net  mesh_ipv6=fd00:dead:beef::2  site="site-b"

[prometheus_hosts]
probe-a

[config_server_hosts]
probe-a

[cert_issuer_hosts]
localhost ansible_connection=local
