# Copy this file to inventory/hosts.ini and edit to match your fleet.
#
# Each host in [piccolo_perf] requires two host variables:
#   probe_address — the address Prometheus scrapes and piccolo-perf uses for
#                   TWAMP reflector discovery. Use a native IPv6 address for
#                   non-VPN deployments, or a VPN-assigned IPv6 for mesh deployments.
#                   IPv4 addresses are accepted when IPv6 is unavailable.
#                   (Legacy: mesh_ipv6= still works but is deprecated.)
#   site          — a short string label for the host's physical/logical site.
#                   Always quote numeric-looking values (e.g. site="809").
#
# To ADD a host: add one line to [piccolo_perf] with probe_address and site.
#                Run: ansible-playbook -i inventory/hosts.ini playbooks/add-host.yml \
#                     -e new_host=<hostname> --ask-vault-pass
#
# To REMOVE a host: run decommission first, then delete the line.
#                Run: ansible-playbook -i inventory/hosts.ini playbooks/decommission.yml \
#                     --limit <hostname> --ask-vault-pass
#                Then delete the host line and re-run site.yml.

[piccolo_perf]
probe-a  ansible_host=probe-a.example.net  probe_address=2001:db8::1  site="site-a"
probe-b  ansible_host=probe-b.example.net  probe_address=2001:db8::2  site="site-b"

[prometheus_hosts]
probe-a

[config_server_hosts]
probe-a

[cert_issuer_hosts]
localhost ansible_connection=local
