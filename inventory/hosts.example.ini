# Copy this file to inventory/hosts.ini (or your own path) and edit ansible_host
# values to match your fleet. Inventory names are short hostnames; ansible_host
# carries the mesh-VPN FQDN used for SSH. Mesh hostnames follow the convention
# "<inventory_hostname>.<mesh_domain>" throughout this project.

[piccolo_perf]
probe-a ansible_host=probe-a.mesh.example.net
probe-b ansible_host=probe-b.mesh.example.net

[prometheus_hosts]
probe-a

[config_server_hosts]
probe-a

[cert_issuer_hosts]
localhost ansible_connection=local
