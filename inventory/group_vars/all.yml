---
# Primary mesh interface — used to resolve this host's mesh IPv6 address.
# Must be a single interface that carries the ULA/mesh IPv6 address.
mesh_iface: wt0
mesh_domain: mesh.example.net

# All mesh/trusted interfaces whose traffic should be permitted to reach fleet
# services. Accepts any interface type: wt0, tailscale0, eth0, zt0, wg0, etc.
# nftables rules allow inbound traffic from any interface in this list and drop
# all other inbound traffic on the relevant ports.
allowed_mesh_ifaces:
  - wt0
  - tailscale0

# systemd units to wait for before starting fleet services.
# Listed in After=/Wants= (not BindsTo=) so services survive a VPN restart.
mesh_vpn_services:
  - tailscaled.service
  - netbird.service

# Fleet topology, shared by the config_server role (serves it as JSON) and
# used by prometheus_hardened's scrape config. Edit to match your fleet.
piccolo_perf_hosts:
  - { name: probe-a, address: "fd00:dead:beef::1", site: site-a }
  - { name: probe-b, address: "fd00:dead:beef::2", site: site-b }

piccolo_perf_measurements:
  - { type: twamp, interval: 60s, targets: all, burst_size: 5, burst_interval: 200ms, packet_timeout: 5s }
  - { type: dns, interval: 120s, resolvers: ["2620:fe::fe", "9.9.9.9"], names: ["example.com"] }
