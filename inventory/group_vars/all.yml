---
# Primary mesh interface — used to resolve this host's mesh IPv6 address.
# Must be a single interface that carries the ULA/mesh IPv6 address.
mesh_iface: wt0
# URL piccolo-perf fetches its config from. Must resolve from all fleet hosts.
# Defaults to https://config.<mesh_domain>:8443 which requires a DNS record.
# Override here if using an existing hostname instead.
piccolo_perf_config_url: "https://controlserver:8443/piccolo-perf-config.json"

# All mesh/trusted interfaces whose traffic should be permitted to reach fleet
# services. Accepts any interface type: wt0, tailscale0, eth0, zt0, wg0, etc.
# nftables rules allow inbound traffic from any interface in this list and drop
# all other inbound traffic on the relevant ports.
allowed_mesh_ifaces:
  - wt0
  - tailscale0

# Controls how nftables rules restrict access to fleet service ports.
# interface     — allow inbound only from interfaces in allowed_mesh_ifaces (VPN deployments)
# source_prefix — allow inbound only from IPv6 prefixes in allowed_source_prefixes (non-VPN, IPv6 only)
# none          — skip nftables deployment entirely; trust host's existing firewall
# mtls          — skip nftables deployment; security via TLS client certs (future)
firewall_mode: interface

# IPv6 source prefixes/addresses allowed when firewall_mode is source_prefix.
# Accepts CIDRs (e.g. 2001:db8::/32) or individual addresses (e.g. 2001:db8::1).
allowed_source_prefixes: []

# systemd units to wait for before starting fleet services.
# Listed in After=/Wants= (not BindsTo=) so services survive a VPN restart.
mesh_vpn_services:
  - tailscaled.service
  - netbird.service

# Fleet topology, shared by the config_server role (serves it as JSON) and
# used by prometheus_hardened's scrape config. Edit to match your fleet.
piccolo_perf_hosts:
  - { name: probe-a, address: "fd00:dead:beef::1", site: site-a }
  - { name: probe-b, address: "fd00:dead:beef::2", site: site-b }

# Measurement schedule — each entry becomes one runMeasurerScheduler goroutine.
# All probe types except bw and dns require CAP_NET_RAW (set by AmbientCapabilities).
# For bandwidth tests: every probe starts a TCP sink on port 5201 automatically;
# peers connect to it. No separate server process is needed. Do not set
# prefer_iperf3 to true unless all peers also have iperf3-server running on 5201.
piccolo_perf_measurements:
  - { type: twamp,    interval: 60s,   targets: all, burst_size: 5, burst_interval: 200ms, packet_timeout: 5s }
  - { type: bw,       interval: 300s,  targets: all, duration: 5s,  prefer_iperf3: false }
  - { type: trace,    interval: 600s,  targets: all, max_hops: 30,  probes_per_hop: 1, timeout: 2s }
  - { type: mtu,      interval: 600s,  targets: all, ceiling: 1500 }
  - { type: dns,      interval: 120s,  resolvers: ["2620:fe::fe", "9.9.9.9"], names: ["example.com"] }
